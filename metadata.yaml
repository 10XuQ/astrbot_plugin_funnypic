name: astrbot_plugin_funnypic
display_name: 吊图放送
short_desc: 随机单抽、十连抽，还能回复图片投稿，把群友的吊图都收进本地图库。
desc: |
  一个简单的吊图插件：从本地图库随机抽图发给你，图库由你自己慢慢养。

  使用方式：
  - 发送 `/吊图`：随机抽一张吊图（默认 10 秒冷却）。
  - 发送 `/吊图十连`：随机抽最多十张不重复的吊图，以合并转发消息发送（默认 180 秒冷却）。
  - 回复一张图片并发送 `/添加吊图`：把这图片收进图库。

  指令都不需要加 `/` 前缀，直接发送命令名也可以。

  特点：
  - 图库固定放在 `data/plugin_data/astrbot_plugin_funnypic`，不会因为启动目录变化而找不到图。
  - 十连抽用 OneBot v11 合并转发消息发送，一次十条也不会刷屏。
  - 投稿直接读取引用消息里的图片，按内容哈希命名，同一张图不会重复入库。
  - 冷却时间可以在 WebUI 的插件配置里调整，设为 0 即关闭冷却。
version: 1.3.0
author: 10XuQ
